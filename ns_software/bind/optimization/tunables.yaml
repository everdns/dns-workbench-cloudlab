# Closed-world whitelist of every knob the BIND config tuner may change.
#
# This file is the single source of truth for three consumers:
#   - render_config.py  (turns a candidate dict into config text)
#   - config_tuner/tuner/space.py   (validates a grid space)
#   - config_tuner/tools_spec.py    (generates the agent's tool JSON schema)
#
# A parameter that is not listed here cannot be expressed by any optimizer.
# Values are int or enum only -- deliberately no free-text type -- so a config
# injection is not merely filtered but unrepresentable. See the project plan.
#
# STATUS: provisional. Run optimization/verify_environment.sh on the name server
# and prune anything it reports as REJECTED before the first campaign.

version: 1
software: bind
role: ns
bind_version_tested: ">=9.18 <9.21"

targets:
  options:
    path: /etc/bind/named.conf.options
    kind: bind_options_block
    header: "// GENERATED BY config_tuner -- do not edit by hand"

  # If verify_environment.sh reports that named.service does NOT source
  # /etc/default/named, change kind to systemd_dropin and path to
  # /etc/systemd/system/named.service.d/10-dns-tuner.conf. Nothing else moves.
  startup:
    path: /etc/default/named
    kind: shell_env
    var: OPTIONS
    prefix_flags: ["-u bind"]

  sysctl:
    path: /etc/sysctl.d/99-dns-tuner.conf
    kind: sysctl_conf

  # The interface is NOT a tunable and never appears in a candidate. The apply
  # script reads it from root-owned nic_allowlist.conf and re-checks it against
  # that allowlist before every ethtool call, so the management NIC and every
  # other interface are untouchable by construction.
  nic:
    kind: ethtool
    iface_source: host_allowlist
    allowlist_path: /usr/local/lib/dns-tuner/nic_allowlist.conf

# Rendered into every candidate, ahead of any tuned directive. The optimizers
# cannot see, name, or override these -- so the listener, the authoritative-only
# posture, and the query ACL survive every candidate.
invariants:
  options:
    directory:       '"/var/cache/bind"'
    recursion:       "no"
    listen-on:       "{ 10.10.1.2; 127.0.0.1; }"
    allow-query:     "{ any; }"
    allow-recursion: "{ none; }"

params:
  # ------------------------------------------------------------ named.conf.options
  - name: minimal_responses
    target: options
    directive: minimal-responses
    type: enum
    values: ["no", "no-auth", "no-auth-recursive", "yes"]
    default: "no"
    changes_semantics: true
    doc: >
      Omit optional AUTHORITY/ADDITIONAL sections. Fewer bytes and less work per
      query, but the wire response differs from the default -- a QPS gain here is
      partly a change of protocol behaviour, not purely a speedup.

  - name: querylog
    target: options
    directive: querylog
    type: enum
    values: ["yes", "no"]
    default: "no"
    changes_semantics: false
    doc: Per-query logging. Enabling it costs syslog I/O on every single query.

  - name: answer_cookie
    target: options
    directive: answer-cookie
    type: enum
    values: ["yes", "no"]
    default: "yes"
    changes_semantics: true
    doc: >
      DNS COOKIE (RFC 7873) generation, one SipHash per response. Disabling it
      removes an off-path spoofing mitigation.

  - name: zone_statistics
    target: options
    directive: zone-statistics
    type: enum
    values: ["none", "terse", "full"]
    default: "terse"
    changes_semantics: false
    doc: Per-zone counter maintenance; "full" adds per-rrtype counters per query.

  - name: notify
    target: options
    directive: notify
    type: enum
    values: ["yes", "no", "explicit", "master-only"]
    default: "yes"
    changes_semantics: false
    doc: Outbound NOTIFY on zone change. No secondaries exist in this testbed.

  - name: dnssec_validation
    target: options
    directive: dnssec-validation
    type: enum
    values: ["auto", "no"]
    default: "auto"
    changes_semantics: true
    doc: >
      Irrelevant to an authoritative-only server; "no" skips trust-anchor setup.
      Flagged as semantic because it changes the server's security posture.

  - name: tcp_clients
    target: options
    directive: tcp-clients
    type: int
    min: 10
    max: 10000
    default: 150
    changes_semantics: false
    doc: Max simultaneous TCP clients. UDP-dominated loads are insensitive to this.

  - name: max_udp_size
    target: options
    directive: max-udp-size
    type: int
    min: 512
    max: 4096
    step: 16
    default: 1232
    changes_semantics: true
    doc: Largest UDP response before BIND truncates and sets TC.

  - name: udp_receive_buffer
    target: options
    directive: udp-receive-buffer
    type: int
    min: 0
    max: 16777216
    step: 65536
    default: 0
    omit_when: 0
    changes_semantics: false
    doc: SO_RCVBUF for UDP listeners; 0 leaves the OS default. Absorbs bursts.

  - name: udp_send_buffer
    target: options
    directive: udp-send-buffer
    type: int
    min: 0
    max: 16777216
    step: 65536
    default: 0
    omit_when: 0
    changes_semantics: false
    doc: SO_SNDBUF for UDP listeners; 0 leaves the OS default.

  # ------------------------------------------------------------ named startup flags
  - name: named_threads
    target: startup
    flag: "-n"
    type: int
    min: 1
    max: 64
    fact_cap: nproc
    default: 0
    omit_when: 0
    changes_semantics: false
    doc: >
      Worker threads (netmgr loops); 0 omits the flag so BIND picks nproc.
      The single largest structural knob on this list.

  # NOTE: `named -U` (UDP listeners) is a no-op on BIND >= 9.18 -- the netmgr
  # replaced that model. It is deliberately absent so no optimizer wastes an
  # evaluation discovering a false null result.

  # ------------------------------------------------------------ OS / sysctl
  - name: net_core_rmem_max
    target: sysctl
    key: net.core.rmem_max
    type: int
    min: 212992
    max: 268435456
    step: 65536
    default: 212992
    changes_semantics: false
    doc: Ceiling for SO_RCVBUF. Must be raised before udp_receive_buffer can take effect.

  - name: netdev_max_backlog
    target: sysctl
    key: net.core.netdev_max_backlog
    type: int
    min: 1000
    max: 300000
    step: 1000
    default: 1000
    changes_semantics: false
    doc: Packets queued to the stack when the NIC out-paces the CPU.

  - name: net_core_somaxconn
    target: sysctl
    key: net.core.somaxconn
    type: int
    min: 128
    max: 65535
    step: 128
    default: 4096
    changes_semantics: false
    doc: Listen backlog ceiling; matters only for the TCP path.

  # ------------------------------------------------------------ NIC (pinned iface)
  - name: nic_rx_ring
    target: nic
    op: ethtool_ring
    field: rx
    type: int
    min: 256
    max: 8192
    step: 256
    default: 0
    omit_when: 0
    fact_cap: ethtool_rx_max
    changes_semantics: false
    doc: RX descriptor ring size on the pinned tuning interface; 0 leaves it alone.

  - name: nic_combined_queues
    target: nic
    op: ethtool_channels
    field: combined
    type: int
    min: 1
    max: 64
    default: 0
    omit_when: 0
    fact_cap: ethtool_combined_max
    risky: true
    changes_semantics: false
    doc: >
      Combined RX/TX queues on the pinned tuning interface; 0 leaves it alone.
      RISKY: applying this bounces the link and can drop the tuner's own SSH
      session, which is why the apply script arms a deadman rollback first.

constraints:
  - name: buffers_need_headroom
    expr: "udp_receive_buffer == 0 or udp_receive_buffer <= net_core_rmem_max"
    message: >
      udp-receive-buffer above net.core.rmem_max is silently clamped by the
      kernel, so the pair would measure the same thing twice.

  - name: buffers_need_threads
    expr: "udp_receive_buffer == 0 or named_threads != 1"
    message: >
      A large receive buffer with a single worker thread is not a configuration
      worth spending a 25-minute evaluation on.
