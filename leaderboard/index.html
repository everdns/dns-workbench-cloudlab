<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DNS Arena</title>
<style>
:root{--bg:#0e1116;--panel:#161b22;--line:#262d37;--text:#e6edf3;--mute:#8b96a5;--accent:#4ea1ff;--bar:#2f81f7;--good:#3fb950;--warn:#d29922}
@media (prefers-color-scheme:light){:root{--bg:#f6f8fa;--panel:#fff;--line:#d8dee4;--text:#1f2328;--mute:#656d76;--accent:#0969da;--bar:#0969da}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,sans-serif}
main{max-width:1200px;margin:0 auto;padding:24px 16px 64px}
h1{margin:0 0 4px;font-size:26px}.sub{color:var(--mute);margin:0 0 20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.label{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.05em;min-width:90px}
.chip{border:1px solid var(--line);background:transparent;color:var(--text);padding:4px 10px;border-radius:999px;cursor:pointer;font:inherit}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
select,input{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font:inherit}
button.link{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit}
.cfgf{display:inline-flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--accent);border-radius:999px;padding:2px 4px 2px 10px}
.cfgf button{background:none;border:0;color:var(--mute);cursor:pointer;font-size:16px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{color:var(--mute);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none;white-space:nowrap}
th.s{color:var(--text)}tr.d{cursor:pointer}tr.d:hover td{background:rgba(127,127,127,.07)}
.rank{font-weight:700;color:var(--mute);width:40px}.r1{color:#e3b341}.r2{color:#b1bac4}.r3{color:#c9824b}
.num{font-variant-numeric:tabular-nums;text-align:right}th.num{text-align:right}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:4px;min-width:140px}.bar i{display:block;height:100%;background:var(--bar);border-radius:3px}
.pill{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 6px;margin:1px 3px 1px 0;font-size:12px;color:var(--mute)}
.pill b{color:var(--text);font-weight:600}
.sample{background:var(--warn);color:#000;font-size:10px;border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:middle}
tr.x td{background:rgba(127,127,127,.05);font-size:13px}
h3{margin:14px 0 6px;font-size:13px}.st{font-weight:600;margin:8px 0 2px}pre{margin:0;padding:8px 10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow-x:auto;font-size:12px;white-space:pre}
.note{margin-top:10px;padding:8px 10px;border:1px solid var(--line);border-left:3px solid var(--warn,#d29922);border-radius:6px;font-size:13px;color:var(--text)}
.empty{padding:30px;text-align:center;color:var(--mute)}
.small{color:var(--mute);font-size:12px}
</style></head><body><main>
<h1>DNS Arena</h1>
<p class="sub">Rankings of DNS server configurations by max sustainable QPS. Filter by hardware, software and configured values.</p>
<div class="panel" id="filters"></div>
<div class="tw"><table><thead id="head"></thead><tbody id="body"></tbody></table></div>
<p class="small" id="count"></p>
</main>
<script src="results.js"></script>
<script>
const R = window.RESULTS;
const COLS = [
  {k:"rank",l:"#"},
  {k:"software",l:"Software",v:r=>r.software},
  {k:"hardware",l:"Hardware",v:r=>r.hardware.name},
  {k:"config",l:"Config"},
  {k:"qps",l:"Max QPS",v:r=>r.metrics.max_qps,num:1},
  {k:"p99",l:"p99 (ms)",v:r=>r.metrics.p99_ms,num:1},
  {k:"ans",l:"Answered %",v:r=>r.metrics.answer_rate,num:1},
];
// state lives in the URL hash: #sort=qps:-1&sw=bind,knot&hw=m400-arm&cfg=xdp=true;threads=8&q=text
let st = {sort:"qps",dir:-1,sw:[],hw:[],cfg:[],q:""}, open = new Set();
const uniq = a => [...new Set(a)].sort();
const fmt = v => typeof v==="number" ? v.toLocaleString() : String(v);

function load(){
  const p = new URLSearchParams(location.hash.slice(1));
  if(p.get("sort")){const [k,d]=p.get("sort").split(":");st.sort=k;st.dir=+d||-1}
  st.sw=(p.get("sw")||"").split(",").filter(Boolean);
  st.hw=(p.get("hw")||"").split(",").filter(Boolean);
  st.cfg=(p.get("cfg")||"").split(";").filter(Boolean).map(s=>s.split("="));
  st.q=p.get("q")||"";
}
function save(){
  const p=new URLSearchParams();
  p.set("sort",st.sort+":"+st.dir);
  if(st.sw.length)p.set("sw",st.sw.join(","));
  if(st.hw.length)p.set("hw",st.hw.join(","));
  if(st.cfg.length)p.set("cfg",st.cfg.map(c=>c.join("=")).join(";"));
  if(st.q)p.set("q",st.q);
  history.replaceState(null,"","#"+p);
}
function toggle(arr,v){const i=arr.indexOf(v);i<0?arr.push(v):arr.splice(i,1)}
const match = r =>
  (!st.sw.length||st.sw.includes(r.software)) &&
  (!st.hw.length||st.hw.includes(r.hardware.name)) &&
  st.cfg.every(([k,v])=>String(r.config[k])===v) &&
  (!st.q||JSON.stringify(r).toLowerCase().includes(st.q.toLowerCase()));

function chips(label,vals,sel,key){
  return `<div class="row"><span class="label">${label}</span>`+vals.map(v=>
    `<button class="chip ${sel.includes(v)?"on":""}" data-t="${key}" data-v="${v}">${v}</button>`).join("")+`</div>`;
}
function renderFilters(){
  // config keys/values offered depend on the currently selected software/hardware
  const base = R.filter(r=>(!st.sw.length||st.sw.includes(r.software))&&(!st.hw.length||st.hw.includes(r.hardware.name)));
  const keys = uniq(base.flatMap(r=>Object.keys(r.config)));
  const hwInfo = h=>{const r=R.find(x=>x.hardware.name===h).hardware;return `${h}`};
  let h = chips("Hardware",uniq(R.map(r=>r.hardware.name)),st.hw,"hw")
        + chips("DNS software",uniq(R.map(r=>r.software)),st.sw,"sw");
  h += `<div class="row"><span class="label">Config value</span>
    <select id="ck"><option value="">key…</option>${keys.map(k=>`<option>${k}</option>`).join("")}</select>
    <select id="cv" disabled><option value="">value…</option></select>`
    + st.cfg.map((c,i)=>`<span class="cfgf">${c[0]} = <b>${c[1]}</b><button data-rm="${i}" title="remove">×</button></span>`).join("")
    + `</div><div class="row"><span class="label">Search</span><input id="q" placeholder="cpu, nic, version…" value="${st.q}">
    <button class="link" id="clear">Clear all</button></div>`;
  document.getElementById("filters").innerHTML=h;
  const ck=document.getElementById("ck"), cv=document.getElementById("cv");
  ck.onchange=()=>{
    const vals=uniq(base.filter(r=>ck.value in r.config).map(r=>String(r.config[ck.value])));
    cv.innerHTML=`<option value="">value…</option>`+vals.map(v=>`<option>${v}</option>`).join("");
    cv.disabled=!ck.value;
  };
  cv.onchange=()=>{if(ck.value&&cv.value){st.cfg=st.cfg.filter(c=>c[0]!==ck.value);st.cfg.push([ck.value,cv.value]);update()}};
  document.getElementById("q").oninput=e=>{st.q=e.target.value;renderTable();save()};
  document.getElementById("clear").onclick=()=>{st={...st,sw:[],hw:[],cfg:[],q:""};update()};
}
function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function steps(h,list){
  if(!list||!list.length)return "";
  return `<h3>${h}</h3>`+list.map(s=>`<div class="step"><div class="st">${esc(s.title)}</div>
    <pre>${esc(s.commands.join("\n"))}</pre></div>`).join("")+
    `<button class="link copy" data-copy="${esc(list.flatMap(s=>s.commands).join("\n")).replace(/"/g,"&quot;")}">Copy all</button>`;
}
function renderTable(){
  const col=COLS.find(c=>c.k===st.sort)||COLS[4];
  const rows=R.filter(match);
  // rank is always by QPS across the filtered set, independent of the sort column
  const rankOf=new Map([...rows].sort((a,b)=>b.metrics.max_qps-a.metrics.max_qps).map((r,i)=>[r.id,i+1]));
  if(col.v) rows.sort((a,b)=>{const x=col.v(a)??-1,y=col.v(b)??-1;return (x>y?1:x<y?-1:0)*st.dir});
  else if(col.k==="rank") rows.sort((a,b)=>(rankOf.get(a.id)-rankOf.get(b.id))*-st.dir);
  const max=Math.max(...rows.map(r=>r.metrics.max_qps),1);
  document.getElementById("head").innerHTML="<tr>"+COLS.map(c=>{
    const s=c.k===st.sort;
    return `<th class="${c.num?"num ":""}${s?"s":""}" ${c.v||c.k==="rank"?`data-s="${c.k}"`:""}>${c.l}${s?(st.dir<0?" ▼":" ▲"):""}</th>`}).join("")+"</tr>";
  document.getElementById("body").innerHTML = rows.length ? rows.map(r=>{
    const n=rankOf.get(r.id), hw=r.hardware;
    const pills=Object.entries(r.config).map(([k,v])=>`<span class="pill">${k} <b>${fmt(v)}</b></span>`).join("");
    return `<tr class="d" data-id="${r.id}"><td class="rank ${n<4?"r"+n:""}">${n}</td>
      <td><b>${r.software}</b> <span class="small">${r.version||""}</span>${r.sample?'<span class="sample">SAMPLE</span>':""}</td>
      <td>${hw.name}${hw.cores||hw.arch?`<div class="small">${[hw.cores&&hw.cores+" cores",hw.arch].filter(Boolean).join(" · ")}</div>`:""}</td>
      <td>${pills}</td>
      <td class="num"><b title="${r.metrics.lower_bound?"Lower bound: limited by the load generator":""}">${r.metrics.lower_bound?"≥ ":""}${fmt(r.metrics.max_qps)}</b><div class="bar"><i style="width:${r.metrics.max_qps/max*100}%"></i></div></td>
      <td class="num">${r.metrics.p99_ms??"–"}</td><td class="num">${r.metrics.answer_rate??"–"}</td></tr>`+
      (open.has(r.id)?`<tr class="x"><td></td><td colspan="6">Hardware: ${[hw.name,hw.cpu,hw.ram_gb&&hw.ram_gb+" GB RAM",hw.nic].filter(Boolean).join(" · ")}
      ${r.measured_with?` · measured with ${Object.entries(r.measured_with).map(([k,v])=>k+" "+v).join(", ")}`:""}
      ${r.notes?`<div class="note">${esc(r.notes)}</div>`:""}${steps("1. Environment setup",r.setup)}${steps("2. Optimize the name server (run on NS_Local)",r.optimize)}
      ${r.setup||r.optimize?"":`<div class="small">No setup/optimize commands recorded. Config: <code>${JSON.stringify(r.config)}</code></div>`}</td></tr>`:"");
  }).join("") : `<tr><td colspan="7" class="empty">No results match these filters.</td></tr>`;
  document.getElementById("count").textContent=`${rows.length} of ${R.length} configurations`;
}
function update(){renderFilters();renderTable();save()}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(c){toggle(st[c.dataset.t],c.dataset.v);return update()}
  const rm=e.target.closest("[data-rm]"); if(rm){st.cfg.splice(+rm.dataset.rm,1);return update()}
  const th=e.target.closest("th[data-s]"); if(th){const k=th.dataset.s;
    st.dir = k===st.sort ? -st.dir : (["software","hardware"].includes(k)?1:-1); st.sort=k;return update()}
  const cp=e.target.closest(".copy"); if(cp){navigator.clipboard?.writeText(cp.dataset.copy);cp.textContent="Copied";return}
  if(e.target.closest("tr.x"))return;
  const tr=e.target.closest("tr.d"); if(tr){const id=tr.dataset.id;open.has(id)?open.delete(id):open.add(id);renderTable()}
});
load(); update();
window.addEventListener("hashchange",()=>{load();update()});
</script></body></html>
